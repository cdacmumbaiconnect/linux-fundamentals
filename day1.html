<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linux Fundamentals – Day 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

/* Layout: course-manual shell. Left sidebar lists parts, chapters and sections; main column holds numbered chapters.
   Palette: neutral paper, ink text, one steel-blue accent, muted amber only for cautions. */
:root{
  --bg:#fafbfc; --surface:#ffffff; --ink:#1b2330; --muted:#586374; --line:#dde2e9;
  --accent:#1f4f8f; --accent-soft:#e9eff7;
  --note-bg:#eef2f8; --note-line:#9db4d3;
  --warn-bg:#fbf3e3; --warn-line:#cf9f46; --warn-ink:#6b4400;
  --code-bg:#f3f6fa; --code-ink:#1f2a37; --code-dim:#5d6b7b; --code-dir:#1f5fae; --code-ok:#1a7a45; --code-err:#b3261e; --code-bar:#e6ecf3; --code-bd:#cfd8e3;
  --good:#1f7a43; --bad:#b3261e;
  --font:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.7}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font-family:var(--mono);font-size:.88em;background:var(--accent-soft);padding:.08em .38em;border-radius:4px}
h1,h2,h3,h4{line-height:1.25;text-wrap:balance;margin:0}
p{margin:0 0 14px;max-width:70ch}
ul,ol{margin:0 0 14px;padding-left:22px;max-width:70ch}
li{margin-bottom:4px}

.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:24px 18px 32px}
.side .title{font-weight:600;font-size:18px;margin-bottom:2px}
.side .sub{color:var(--muted);font-size:13.5px;margin-bottom:18px}
.menu-btn{display:none;margin-bottom:12px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:14px}
.nav{list-style:none;margin:0;padding:0}
.nav .part{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 0 6px}
.nav .part:first-child{margin-top:0}
.nav>li.ch{margin:0}
.nav a{display:block;text-decoration:none;color:var(--ink);font-size:14.5px;line-height:1.4;padding:6px 10px;border-radius:6px}
.nav>li>a{display:grid;grid-template-columns:22px 1fr;gap:6px}
.nav>li>a span:first-child{color:var(--muted);font-variant-numeric:tabular-nums}
.nav a:hover{background:var(--accent-soft)}
.nav li.active>a{font-weight:600;color:var(--accent);background:var(--accent-soft)}
.nav ul{list-style:none;margin:2px 0 6px;padding:0 0 0 28px;display:none;border-left:1px solid var(--line);margin-left:15px}
.nav li.active>ul{display:block}
.nav ul a{font-size:13.5px;color:var(--muted);padding:4px 8px}
.nav ul a.on{color:var(--accent);font-weight:500}

main{padding:40px clamp(18px,4vw,56px) 96px;max-width:960px;width:100%}
.masthead{padding-bottom:24px;margin-bottom:40px;border-bottom:2px solid var(--ink)}
.masthead h1{font-size:clamp(30px,4vw,40px);font-weight:600;margin-bottom:8px}
.masthead p{color:var(--muted);font-size:17px;margin-bottom:8px}
.masthead .how{font-size:15px}
.chapter{margin-bottom:72px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.chapter>header{margin-bottom:22px}
.chapter .label{font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:6px}
.chapter h2{font-size:clamp(26px,3.2vw,34px);font-weight:600;margin-bottom:10px}
.chapter .overview{font-size:17px;color:var(--muted)}
.chapter h3{font-size:20px;font-weight:600;margin:36px 0 10px;scroll-margin-top:16px}
.chapter h4{font-size:15px;font-weight:600;margin:20px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.chapter{scroll-margin-top:16px}

.scenario{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);padding:14px 18px;margin:0 0 18px;border-radius:0 6px 6px 0}
.scenario .t{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:4px}
.scenario p{margin:0 0 8px}
.scenario .builds{font-size:14px;color:var(--muted);margin:0}
.objectives{background:var(--surface);border:1px solid var(--line);padding:14px 18px;border-radius:6px;margin-bottom:8px}
.objectives .t{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.objectives ul{margin:0}
.note,.warn{padding:12px 16px;border-radius:6px;margin:16px 0;font-size:15px;border-left:4px solid var(--note-line);background:var(--note-bg)}
.warn{border-left-color:var(--warn-line);background:var(--warn-bg);color:var(--warn-ink)}
.note b,.warn b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.note p,.warn p{margin:0}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 18px;margin:28px 0 8px}
.summary h4{margin:0 0 6px;color:var(--ink)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface);margin:12px 0 18px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--bg);font-weight:600;font-size:13.5px}
tr:last-child td{border-bottom:0}
td code{white-space:nowrap}
td:first-child{font-weight:500}

pre.code{border:1px solid var(--code-bd);position:relative;margin:12px 0 18px;background:var(--code-bg);color:var(--code-ink);border-radius:6px;padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.6}
pre.code .c{color:var(--code-dim)}
pre.code .p{color:var(--code-ok)}
pre.code button{position:absolute;top:8px;right:8px;background:transparent;color:var(--code-dim);border:1px solid var(--code-bd);border-radius:4px;font-size:12px;padding:1px 8px}
pre.code button:hover{color:#fff}
pre.tree .d{color:var(--code-dir)}
.figure{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;margin:14px 0 18px}
.figure figcaption{font-size:13.5px;color:var(--muted);margin-top:10px}
.figure svg{width:100%;height:auto;display:block}
.figure .box{fill:var(--surface);stroke:var(--muted);stroke-width:1.2}
.figure .box.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.8}
.figure text{fill:var(--ink);font-family:var(--font)}
.figure .nm{font-weight:600;font-size:15px}
.figure .ds{font-size:13px;fill:var(--muted)}
.figure .ar{stroke:var(--muted);stroke-width:1.3;fill:none}

/* practice */
.practice{border:1px solid var(--line);border-radius:6px;background:var(--surface);margin:14px 0 18px;overflow:hidden}
.practice>.h{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:15px}
.practice>.h span{font-weight:400;color:var(--muted);font-size:13.5px}
.lab{display:grid;grid-template-columns:minmax(0,1fr) 270px}
.goals{padding:14px 16px;border-left:1px solid var(--line);font-size:14px}
.goals h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.goals ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.goals li{display:grid;grid-template-columns:18px 1fr;gap:8px;margin:0}
.goals li i{width:15px;height:15px;border:1.5px solid var(--muted);border-radius:3px;margin-top:4px}
.goals li.ok i{background:var(--good);border-color:var(--good)}
.goals li.ok span{color:var(--muted);text-decoration:line-through}
.goals .hint{margin-top:12px;font-size:13px;color:var(--muted)}
.goals .hint button{background:none;border:0;color:var(--accent);padding:0;text-decoration:underline;font-size:13px}
.term{background:var(--code-bg);border-top:1px solid var(--code-bd);color:var(--code-ink);font-family:var(--mono);font-size:13.5px}
.term .out{height:300px;overflow:auto;padding:12px 16px;white-space:pre-wrap;word-break:break-word}
.term .p{color:var(--code-ok)}
.term .d{color:var(--code-dir)}
.term .err{color:var(--code-err)}
.term .row{display:flex;gap:8px;padding:0 16px 12px}
.term .row .p{white-space:nowrap}
.term input{flex:1;min-width:0;background:transparent;border:0;color:inherit;font:inherit;outline:none}
.term .bar{display:flex;justify-content:space-between;padding:6px 16px;background:var(--code-bar);color:var(--code-dim);font-size:12px}
.term .bar button{background:none;border:0;color:var(--code-dim);text-decoration:underline;font-size:12px}
.term:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
.calc{display:flex;gap:12px;flex-wrap:wrap;align-items:end;padding:14px 16px}
.calc label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.calc input,.calc select{font-family:var(--mono);font-size:14px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:7px 10px;min-width:0}
.result{font-family:var(--mono);background:var(--code-bg);color:var(--code-ink);border-radius:4px;padding:7px 12px;font-size:14px}
.btn{background:var(--accent);color:var(--surface);border:0;border-radius:4px;padding:7px 14px;font-weight:500}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.drill{padding:0 16px 16px;border-top:1px solid var(--line)}
.fb{font-size:14.5px;margin-top:8px}.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
.vi{background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);font-size:13.5px}
.vi textarea{display:block;width:100%;min-height:120px;background:transparent;color:inherit;border:0;padding:12px 16px;font:inherit;resize:vertical;outline:none}
.vi .status{display:flex;justify-content:space-between;gap:12px;padding:6px 16px;background:var(--code-bar);color:var(--code-dim)}
.vi .status b{color:var(--code-ok)}
.vi .keys{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px;background:var(--code-bar)}
.vi .keys button{background:transparent;color:var(--code-ink);border:1px solid var(--code-bd);border-radius:4px;padding:3px 10px;font-family:var(--mono);font-size:12.5px}
.vi .keys button:hover{border-color:var(--code-ok)}

details.rq{border:1px solid var(--line);border-radius:6px;background:var(--surface);margin:8px 0;padding:0}
details.rq summary{padding:10px 16px;cursor:pointer;font-weight:500}
details.rq p{padding:0 16px 12px;margin:0;color:var(--muted)}
.checks{list-style:none;padding:0;margin:12px 0}
.checks li{display:grid;grid-template-columns:24px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin-bottom:8px}
.checks input{width:17px;height:17px;margin-top:5px;accent-color:var(--accent)}
.checks small{display:block;color:var(--muted)}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px}
  .menu-btn{display:inline-block}
  .nav{display:none}
  .nav.open{display:block}
  .lab{grid-template-columns:1fr}
  .goals{border-left:0;border-top:1px solid var(--line)}
}
@media print{
  .side,.menu-btn,pre.code button,.practice,.vi,.qz-setup{display:none!important}
  .app{display:block}
  body{background:#fff;font-size:11pt}
  .chapter{break-before:page}
  details.rq{break-inside:avoid}
  details.rq[open] p,details.rq p{display:block}
}
/* tickets */
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:6px;margin:0 0 18px;overflow:hidden}
.ticket .th{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:9px 16px;background:var(--accent-soft);border-bottom:1px solid var(--line)}
.ticket .id{font-family:var(--mono);font-weight:600;color:var(--accent);font-size:13.5px}
.ticket .ti{font-weight:600;flex:1;min-width:180px}
.ticket .st{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:1px 9px;background:var(--surface)}
.ticket dl{margin:0;padding:10px 16px 2px;display:grid;grid-template-columns:110px 1fr;gap:6px 14px}
.ticket dt{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding-top:3px}
.ticket dd{margin:0 0 6px}
.ticket .builds{font-size:14px;color:var(--muted);margin:0;padding:8px 16px 12px;border-top:1px solid var(--line)}
@media(max-width:600px){.ticket dl{grid-template-columns:1fr}.ticket dt{padding-top:0}}
/* lab extras */
.goals li.grp{display:block;margin-top:6px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.goals .prog{margin-top:10px;font-size:13px;font-weight:600}
.practice.big .term .out{height:380px}
.vied{background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);font-size:13.5px}
.vied .vihead{padding:6px 16px;background:var(--code-bar);color:var(--code-dim);font-size:12px}
.vied textarea{display:block;width:100%;height:240px;background:transparent;color:inherit;border:0;padding:10px 16px;font:inherit;resize:none;outline:none;caret-color:var(--code-ok)}
.vied .vistat{padding:6px 16px;background:var(--code-bar);font-size:12.5px;min-height:30px}
.vied .vistat b{color:var(--code-ok)}
.vied .vicmd{display:flex;gap:4px;padding:6px 16px;background:var(--code-bar)}
.vied .vicmd input{flex:1;background:transparent;border:0;color:inherit;font:inherit;outline:none}
.term .bar span button{margin-left:10px}
.term .bar button.cd{border:1px solid var(--code-bd);padding:1px 8px;border-radius:3px;text-decoration:none}
/* quiz */
.qz-setup{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px}
.qz-setup .row{display:flex;flex-wrap:wrap;gap:12px 22px;margin:10px 0}
.qz-setup label{font-size:14.5px;display:flex;gap:6px;align-items:center}
.qz-setup select{font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink)}
.qz-bar{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.qz-bar b{color:var(--ink)}
.qz-q{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px}
.qz-q .tag{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);font-weight:600}
.qz-q .stem{margin:6px 0 12px;font-weight:500}
.qz-q pre{margin:0 0 12px;padding:10px 14px;background:var(--code-bg);color:var(--code-ink);border-radius:4px;font-family:var(--mono);font-size:13.5px;overflow:auto;white-space:pre-wrap}
.qz-opt{display:block;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:9px 12px;margin-bottom:8px;font:inherit;cursor:pointer}
.qz-opt:hover{border-color:var(--accent)}
.qz-opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.qz-opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.qz-opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.qz-exp{margin-top:10px;font-size:14.5px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--accent-soft)}
.qz-nav{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.qz-res{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px}
.qz-res .big{font-size:30px;font-weight:600}
.qz-res table{margin-top:10px}
.qz-rev{margin-top:14px}
.qz-rev details{border:1px solid var(--line);border-radius:5px;padding:8px 12px;margin-bottom:8px;background:var(--surface)}
.qz-rev summary{cursor:pointer;font-weight:500}
/* visual helpers */
.figure .box.ok{fill:#e8f5ee;stroke:var(--good);stroke-width:1.6}
.figure .box.no{fill:#fbeceb;stroke:var(--bad);stroke-width:1.6}
.figure .box.am{fill:var(--warn-bg);stroke:var(--warn-line);stroke-width:1.6}
.figure .box.dk{fill:var(--code-bg);stroke:var(--code-bd)}
.figure .mono{font-family:var(--mono);font-size:15px}
.figure .big{font-family:var(--mono);font-size:26px;font-weight:600}
.figure .lbl{font-size:12.5px;fill:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.figure .ar2{stroke:var(--accent);stroke-width:1.8;fill:none}
.figure .ar3{stroke:var(--bad);stroke-width:1.8;fill:none;stroke-dasharray:5 4}
.predict{border:1px dashed var(--accent);border-radius:6px;background:var(--surface);margin:12px 0 18px;padding:0}
.predict summary{cursor:pointer;padding:10px 14px;font-weight:600;color:var(--accent)}
.predict>div{padding:0 14px 12px}
.predict pre{margin:8px 0 0}
.widget{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin:14px 0 18px}
.widget h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{font-family:var(--mono);font-size:13.5px;padding:3px 10px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--muted)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.widget input[type=text]{font-family:var(--mono);font-size:15px;padding:6px 10px;border:1px solid var(--line);border-radius:4px;width:min(320px,100%);background:var(--surface);color:var(--ink)}
.pgrid{display:grid;grid-template-columns:90px repeat(3,1fr);gap:6px;max-width:460px;margin:8px 0}
.pgrid div{padding:6px 8px;border-radius:4px;text-align:center;font-size:14px}
.pgrid .hd{font-weight:600;color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.06em}
.pgrid label{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--bg);border:1px solid var(--line);cursor:pointer;font-family:var(--mono)}
.pgrid label.on{background:var(--accent-soft);border-color:var(--accent)}
.pout{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:10px}
.pout .v{font-family:var(--mono);font-size:22px;font-weight:600}
.pout small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.ldemo{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.ldemo{grid-template-columns:1fr}}
.ldemo pre{margin:0;font-size:13.5px;white-space:pre-wrap}
.ldemo .btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.cheat{background:var(--accent-soft);border:1px solid var(--line);border-radius:6px;padding:12px 16px;margin:16px 0}
.cheat h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.cheat code{white-space:nowrap}
.nanobar{display:flex;flex-wrap:wrap;gap:6px 12px;padding:6px 16px 8px;background:var(--code-bar)}
.nanobar button{background:transparent;color:var(--code-ink);border:0;font:inherit;font-size:12.5px;cursor:pointer;padding:2px 4px}
.nanobar button b{background:var(--code-ink);color:var(--code-bar);padding:0 4px;border-radius:2px;margin-right:4px}
.term .bar button.kd,.term .bar button.kc,.term .bar button.kz{border:1px solid var(--code-bd);padding:1px 8px;border-radius:3px;text-decoration:none}

.ldemo pre code{background:none;padding:0;border:0}


/* ======== New shell: course map + lesson player ======== */
:root{--s0:#1f4f8f;--s0s:#e9eff7;--s1:#0f6e6a;--s1s:#e4f2f1;--s2:#5b3d99;--s2s:#efeaf8;--s3:#9a5a0b;--s3s:#f8efe2}
body{background:#f6f7f9;line-height:1.6}
#app{min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 22px;background:#fff;border-bottom:1px solid var(--line)}
.top .brand{font-weight:600;font-size:16px;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:10px;white-space:nowrap}
.top .brand b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:7px;background:var(--ink);color:#fff;font-family:var(--mono);font-size:14px}
.top nav{display:flex;gap:4px;margin-left:8px;flex-wrap:wrap}
.top nav a{font-size:14px;color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:6px}
.top nav a:hover{background:var(--accent-soft);color:var(--ink)}
.top nav a.on{background:var(--ink);color:#fff}
.top .sp{flex:1}
.zoom{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.zoom button{background:#fff;border:0;padding:4px 10px;font-size:14px;color:var(--ink)}
.zoom button+button{border-left:1px solid var(--line)}
.zoom button:hover{background:var(--accent-soft)}
#view{flex:1}
.page{max-width:1180px;margin:0 auto;padding:34px 28px 60px}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:34px;align-items:center;margin-bottom:34px}
.hero h1{font-size:clamp(32px,4vw,46px);font-weight:600;letter-spacing:-.01em;margin-bottom:10px}
.hero p.lead{font-size:18.5px;color:var(--muted);max-width:52ch;margin-bottom:18px}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap}
.btn.lg{padding:10px 20px;font-size:16px}
.cast{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.cast h3{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:600}
.cast p{font-size:14.5px;color:var(--muted);margin-bottom:12px}
.cast ul{list-style:none;padding:0;margin:0;display:grid;gap:9px;max-width:none}
.cast li{display:flex;align-items:center;gap:11px;margin:0;font-size:14.5px}
.cast li small{color:var(--muted);display:block;font-size:12.5px;line-height:1.3}
.av{flex:none;display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;color:#fff;font-weight:600;font-size:14px;letter-spacing:.02em}
.av.SA{background:#1b2330}.av.SW{background:#0f6e6a}.av.NG{background:#1f4f8f}.av.SZ{background:#5b3d99}.av.AV{background:#9a5a0b}
.stage-h{display:flex;align-items:baseline;gap:12px;margin:30px 0 12px}
.stage-h .no{font-family:var(--mono);font-size:13px;color:#fff;padding:2px 9px;border-radius:4px}
.stage-h h2{font-size:21px;font-weight:600}
.stage-h p{margin:0;color:var(--muted);font-size:14.5px}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mod{position:relative;display:flex;flex-direction:column;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden;color:var(--ink);transition:transform .12s,box-shadow .12s}
.mod:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(20,30,50,.08)}
.mod .gl{font-family:var(--mono);font-size:22px;font-weight:500;padding:20px 18px 16px;border-bottom:1px solid var(--line)}
.mod .gl span{opacity:.45}
.mod .bd{padding:12px 18px 16px;flex:1;display:flex;flex-direction:column}
.mod .k{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.mod .t{font-weight:600;font-size:16.5px;line-height:1.3;margin:3px 0 4px}
.mod .d{font-size:14px;color:var(--muted);line-height:1.45;flex:1}
.mod .pg{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--muted)}
.mod .pg i{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.mod .pg i b{position:absolute;inset:0 auto 0 0;border-radius:3px}
.mod.done .pg span{color:var(--good);font-weight:600}
.tools3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:34px}
.tool{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px;text-align:left;color:var(--ink)}
.tool:hover{border-color:var(--ink)}
.tool .t{font-weight:600;font-size:17px;margin-bottom:4px}
.tool .d{font-size:14px;color:var(--muted)}
.tool .gl{font-family:var(--mono);font-size:13px;color:var(--muted);margin-bottom:10px}

/* lesson player */
.lesson{display:flex;flex-direction:column;min-height:calc(100vh - 53px)}
.lhead{background:#fff;border-bottom:1px solid var(--line);padding:12px 28px 0}
.lhead .row1{display:flex;align-items:center;gap:14px;max-width:1180px;margin:0 auto}
.lhead .mk{font-family:var(--mono);font-size:13px;color:#fff;padding:3px 9px;border-radius:4px;white-space:nowrap}
.lhead h1{font-size:19px;font-weight:600;line-height:1.3}
.rail{display:flex;gap:4px;max-width:1180px;margin:12px auto 0;padding-bottom:12px}
.rail button{flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;cursor:pointer}
.rail button i{display:block;height:5px;border-radius:3px;background:var(--line)}
.rail button span{display:block;font-size:11.5px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.rail button.seen i{background:#b9c3d0}
.rail button.on span{color:var(--ink);font-weight:600}
.stagewrap{flex:1;padding:26px 28px 30px}
.step{max-width:1180px;margin:0 auto;display:none}
.step.on{display:block;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.step.on{animation:none}}
.kind{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.step h2{font-size:clamp(25px,2.6vw,32px);font-weight:600;letter-spacing:-.005em;margin-bottom:14px}
.step p,.step li{font-size:18px;line-height:1.6}
.step p{max-width:66ch}
.step .lead{font-size:20px;color:var(--ink)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:34px;align-items:start}
.lfoot{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 28px}
.lfoot .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px}
.lfoot .mid{flex:1;text-align:center;font-size:13.5px;color:var(--muted)}
.lfoot .keys{font-size:12px;color:var(--muted)}

/* story */
.story{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:34px;align-items:center;padding:8px 0}
.who{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.who .av{width:58px;height:58px;font-size:19px}
.who b{display:block;font-size:18px}
.who small{color:var(--muted);font-size:14px}
.bubble{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 24px;font-size:21px;line-height:1.55;max-width:60ch}
.bubble:before{content:"";position:absolute;left:26px;top:-9px;width:16px;height:16px;background:#fff;border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.mission{border-radius:12px;padding:22px 24px;color:#fff}
.mission .k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.8;font-weight:600}
.mission .m{font-size:20px;line-height:1.5;margin-top:6px;font-weight:500}
.mission ul{margin:14px 0 0;padding:0;list-style:none;border-top:1px solid rgba(255,255,255,.25);padding-top:12px}
.mission li{font-size:15.5px;margin:4px 0;opacity:.95}
.mission li:before{content:"→  ";opacity:.7}

/* visuals */
.v-stack{display:flex;flex-direction:column;gap:8px}
.v-stack div{border-radius:9px;padding:13px 18px;border:1px solid var(--line);background:#fff;display:flex;justify-content:space-between;align-items:baseline;gap:14px}
.v-stack b{font-size:17px}
.v-stack span{font-size:14.5px;color:var(--muted);text-align:right}
.v-stack .t0{background:#1b2330;color:#fff;border-color:#1b2330}.v-stack .t0 span{color:#c6cfdb}
.v-stack .t1{background:var(--s0s);border-color:#c5d4e8}
.v-stack .t2{background:var(--s1s);border-color:#bfdcd9}
.v-stack .t3{background:var(--s2s);border-color:#d6cbec}
.v-flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;row-gap:12px}
.v-flow .n{flex:1;min-width:130px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:12px 14px}
.v-flow .n b{display:block;font-size:16px;margin-bottom:3px}
.v-flow .n span{font-size:14px;color:var(--muted);line-height:1.45;display:block}
.v-flow .n code{font-size:13px}
.v-flow .ar{align-self:center;padding:0 8px;color:var(--muted);font-size:20px}
.v-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.v-grid div{background:#fff;border:1px solid var(--line);border-radius:9px;padding:13px 15px}
.v-grid b{display:block;font-size:16.5px;margin-bottom:3px}
.v-grid b.m{font-family:var(--mono);font-weight:500}
.v-grid span{font-size:14.5px;color:var(--muted);line-height:1.45;display:block}
.v-tl{position:relative;padding-left:4px}
.v-tl div{display:grid;grid-template-columns:76px 1fr;gap:14px;padding:10px 0;border-bottom:1px dashed var(--line)}
.v-tl div:last-child{border:0}
.v-tl b{font-family:var(--mono);font-size:18px}
.v-tl span{font-size:16.5px}
.v-tl div.hl b,.v-tl div.hl span{color:var(--accent);font-weight:600}
.v-eq{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.v-eq .b{background:#fff;border:1px solid var(--line);border-radius:9px;padding:12px 16px;text-align:center;min-width:110px}
.v-eq .b b{display:block;font-size:16px}
.v-eq .b span{font-size:13px;color:var(--muted)}
.v-eq .op{font-size:22px;color:var(--muted);padding:0 2px}
.v-eq .b.res{background:#1b2330;color:#fff;border-color:#1b2330}.v-eq .b.res span{color:#c6cfdb}
.v-term{background:#1b2330;color:#e6ebf2;border-radius:10px;padding:16px 18px;font-family:var(--mono);font-size:15px;line-height:1.6;white-space:pre-wrap;overflow:auto;margin:0}
.v-term .pr{color:#7fd1a8}
.v-term .cm{color:#fff;font-weight:500}
.v-term .dim{color:#93a1b3}
.v-ann{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;font-family:var(--mono)}
.v-ann .seg{display:flex;flex-direction:column;align-items:stretch;text-align:center}
.v-ann .seg code{font-size:22px;padding:8px 10px;border-radius:7px;background:#fff;border:2px solid var(--line)}
.v-ann .seg small{font-family:var(--font);font-size:13px;color:var(--muted);margin-top:6px;line-height:1.3;max-width:120px;align-self:center}
.v-ann .c0 code{border-color:#1f4f8f;color:#1f4f8f}.v-ann .c1 code{border-color:#0f6e6a;color:#0f6e6a}.v-ann .c2 code{border-color:#5b3d99;color:#5b3d99}.v-ann .c3 code{border-color:#9a5a0b;color:#9a5a0b}.v-ann .c4 code{border-color:#b3261e;color:#b3261e}.v-ann .c5 code{border-color:#586374;color:#586374}
.v-tree{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 18px;font-family:var(--mono);font-size:15.5px;line-height:1.7;white-space:pre;overflow:auto;margin:0}
.v-tree em{font-style:normal;color:var(--muted);font-family:var(--font);font-size:14px}
figure.svgfig{margin:0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}
figure.svgfig figcaption{font-size:14px;color:var(--muted);margin-top:8px}
figure.svgfig svg{width:100%;height:auto}

/* command step */
.syn{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 18px}
.syn span{font-family:var(--mono);font-size:26px;padding:6px 14px;border-radius:8px;border:2px solid}
.syn .c{border-color:#1f4f8f;color:#1f4f8f;background:var(--s0s)}
.syn .o{border-color:#0f6e6a;color:#0f6e6a;background:var(--s1s)}
.syn .a{border-color:#9a5a0b;color:#9a5a0b;background:var(--s3s)}
.legend{display:flex;gap:16px;font-size:13.5px;color:var(--muted);margin:-8px 0 16px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.crows{display:grid;gap:8px}
.crow{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.3fr);gap:16px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px 16px}
.crow code{font-size:17px;background:none;padding:0;color:#1b2330;font-weight:500}
.crow span{font-size:16px;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:15px}
.opts code{font-size:15px;margin-right:6px}

/* compare */
.vs{display:grid;gap:16px}
.vs .col{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.vs .col h3{font-size:19px;padding:14px 18px;color:#fff}
.vs .col ul{margin:0;padding:12px 18px 16px 36px;max-width:none}
.vs .col li{font-size:16.5px;margin:6px 0}
.vs .col .ex{margin:0 18px 16px;font-family:var(--mono);font-size:15px;background:var(--code-bg);border-radius:6px;padding:8px 12px;white-space:pre-wrap}

/* predict */
.pred{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
.pred .q{font-size:20px;font-weight:500;margin:0 0 16px}
.reveal{border:2px dashed var(--line);border-radius:12px;min-height:150px;display:grid;place-items:center;padding:18px;background:#fff}
.reveal .ans{display:none;width:100%}
.reveal.open{border-style:solid;border-color:var(--good);place-items:start}
.reveal.open .ans{display:block}
.reveal.open .rb{display:none}
.reveal .ans .ok{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--good);margin-bottom:8px}
.reveal .ans p{font-size:17.5px}

/* traps */
.traps{display:grid;gap:12px}
.trap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.trap .w,.trap .r{padding:12px 16px}
.trap .w{background:#fcf1f0;border-right:1px solid var(--line)}
.trap .r{background:#eef7f1}
.trap small{display:block;font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.trap .w small{color:var(--bad)}.trap .r small{color:var(--good)}
.trap code{font-size:16px;background:none;padding:0}
.trap .why{grid-column:1/-1;padding:10px 16px;font-size:15.5px;color:var(--muted);border-top:1px solid var(--line)}

/* checks */
.chk{display:grid;gap:16px}
.cq{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 20px}
.cq .st{font-size:18px;font-weight:500;margin-bottom:10px;line-height:1.5}
.cq pre{background:var(--code-bg);padding:10px 14px;border-radius:6px;font-family:var(--mono);font-size:14.5px;margin:0 0 10px;white-space:pre-wrap}
.cq .os{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cq .os button{text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:16px;line-height:1.45;color:var(--ink)}
.cq .os button:hover{border-color:var(--ink)}
.cq .os button.r{background:#eef7f1;border-color:var(--good)}
.cq .os button.w{background:#fcf1f0;border-color:var(--bad)}
.cq .ex{display:none;margin-top:10px;font-size:15.5px;color:var(--muted)}
.cq.done .ex{display:block}
.cq.done .os button{pointer-events:none}
.score{font-size:15px;color:var(--muted);margin-top:4px}

/* recap */
.recap{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:30px;align-items:start}
.recap ol{counter-reset:r;list-style:none;padding:0;margin:0;max-width:none}
.recap ol li{counter-increment:r;position:relative;padding:12px 16px 12px 56px;background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;font-size:17.5px}
.recap ol li:before{content:counter(r);position:absolute;left:14px;top:11px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:14px;background:var(--rc,#1b2330)}
.kit{background:#1b2330;color:#fff;border-radius:12px;padding:18px 20px}
.kit h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#aab6c6;margin-bottom:12px}
.kit .chips{display:flex;flex-wrap:wrap;gap:8px;margin:0}
.kit .chips span{font-family:var(--mono);font-size:15px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:5px 10px}
.nextm{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}

/* practice inside lesson */
.step .practice{margin:10px 0 0}
.step .practice .term .out{height:330px}
.step .practice .goals{font-size:15px}
.step .practice .goals li span{line-height:1.5}
.step .practice .lab{grid-template-columns:minmax(0,1fr) 330px}
.tryintro{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.tryintro p{margin:0}
.done-banner{display:none;margin-top:12px;padding:12px 16px;border-radius:9px;background:#eef7f1;border:1px solid var(--good);color:var(--good);font-weight:600}
.done-banner.on{display:block}

/* directory explorer */
.dmap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.dmap .dirs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:start}
.dmap .dirs button{font-family:var(--mono);font-size:17px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 8px;color:var(--ink)}
.dmap .dirs button:hover{border-color:var(--ink)}
.dmap .dirs button.on{background:#1b2330;color:#fff;border-color:#1b2330}
.dmap .info{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px 22px;min-height:230px}
.dmap .info .p{font-family:var(--mono);font-size:28px;margin-bottom:6px}
.dmap .info .w{font-size:19px;font-weight:500;margin-bottom:10px}
.dmap .info .e{font-size:16px;color:var(--muted)}

/* cheat sheet + labs pages */
.pagehead h1{font-size:32px;font-weight:600;margin-bottom:6px}
.pagehead p{color:var(--muted);font-size:17px}
.search{display:flex;gap:10px;align-items:center;margin:18px 0 10px;flex-wrap:wrap}
.search input{flex:1;min-width:240px;font:inherit;font-size:17px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:#fff}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.fchips button{font-size:13.5px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 12px;color:var(--muted)}
.fchips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.cs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.cs div{background:#fff;border:1px solid var(--line);border-radius:9px;padding:12px 15px}
.cs b{display:block;font-family:var(--mono);font-weight:500;font-size:16px;margin-bottom:2px}
.cs span{font-size:14.5px;color:var(--muted);display:block;line-height:1.45}
.cs small{font-size:11.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.tabs{display:flex;gap:8px;margin:20px 0 14px;flex-wrap:wrap}
.tabs button{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 16px;text-align:left;color:var(--ink)}
.tabs button b{display:block;font-size:15.5px}
.tabs button span{font-size:13px;color:var(--muted)}
.tabs button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.labpane{display:none}.labpane.on{display:block}
.labpane .practice .term .out{height:420px}
.labpane .practice .lab{grid-template-columns:minmax(0,1fr) 340px}

@media (max-width:900px){
  .hero,.story,.two,.pred,.recap,.dmap,.trap{grid-template-columns:1fr}
  .tools3{grid-template-columns:1fr}
  .cq .os{grid-template-columns:1fr}
  .step .practice .lab,.labpane .practice .lab{grid-template-columns:1fr}
  .top nav a{padding:6px 8px}
  .rail button span{display:none}
  .lfoot .keys{display:none}

L({day:1,id:"intro",n:1,stage:0,t:"What is Linux?",g:'<span>$</span> ls /',d:"The kernel, distributions, why servers run Linux, and how its files are organised.",
learn:["What Linux really is","How a distribution is put together","How the file system is organised","Your first commands: hostname, uname, ls, cat"],
steps:[
 story("SA","Our online shop runs on an old office PC. It crashed twice during the festival sale. We are moving it to a proper server called <b>sunrise-app</b>, and it will run Linux.","Find out what Linux is, identify the server you have just logged into, and learn where everything is kept on it."),
 idea("Where Linux came from","Linux started as one student's hobby project and grew into the system that runs most of the internet.",V.tl([
   ["1969","Unix is created at Bell Labs"],
   ["1983","Richard Stallman starts GNU, a project to write free Unix-like tools"],
   ["1991","Linus Torvalds, a 21-year-old student in Helsinki, announces his kernel on 25 August and releases version 0.01 on 17 September",1],
   ["Today","Linux runs most cloud servers, every Android phone, and every system on the TOP500 list of supercomputers (100% since November 2017)"]]),"two"),
 idea("Linux is a kernel","The <b>kernel</b> is the core of the operating system. It controls the CPU, memory, disks and devices, and decides which program runs when. On its own it cannot do much: you need tools around it.",V.stack([
   ["Applications","web server, database, editors","t3"],
   ["Shell and tools","bash, ls, cp, grep","t2"],
   ["Linux kernel","CPU, memory, disks, devices","t1"],
   ["Hardware","the physical machine","t0"]]),"two"),
 idea("Kernel + tools = distribution","A <b>distribution</b> (distro) packages the kernel with everything needed to use it. Ubuntu, Debian, Fedora and Red Hat Enterprise Linux are all distributions of the same Linux kernel.",V.eq([
   ["Linux kernel","the core"],["GNU tools","ls, cp, grep"],["Shell","bash"],["Package manager","apt, dnf"]],["Distribution","e.g. Ubuntu"])),
 vs("Distribution families",[
   {t:"Debian family",pts:["Debian, Ubuntu, Linux Mint","Packages: <code>.deb</code>","Install with <code>apt</code>"],ex:"sudo apt install tree"},
   {t:"Red Hat family",pts:["RHEL, Fedora, Rocky Linux","Packages: <code>.rpm</code>","Install with <code>dnf</code> (older: <code>yum</code>)"],ex:"sudo dnf install tree"},
   {t:"Others",pts:["Arch Linux: <code>pacman</code>","openSUSE: <code>zypper</code>","Alpine (containers): <code>apk</code>"],ex:"sudo pacman -S tree"}],
   "The commands you learn in this course work on all of them. Only the package manager changes."),
 idea("Why servers choose Linux","",V.grid([
   ["Free and open","No licence fee per server; anyone can read and improve the code."],
   ["Stable","Servers run for months without a reboot."],
   ["Secure","Strict users and permissions; security fixes arrive quickly."],
   ["Lightweight","No graphical desktop needed; more power left for the application."],
   ["Long-term support","Ubuntu LTS releases get five years of free standard security updates (22.04 LTS: until May 2027)."],
   ["Everywhere","Cloud, containers, supercomputers, phones, routers."]])),
 cmd("Identify your system",{p:"Your first commands. Type a command, press Enter, read the answer. Each one answers a single question.",rows:[
   ["hostname","What is this machine called?"],
   ["uname -r","Which kernel release is running? (<code>-r</code> = release)"],
   ["uname -a","All system information in one line (<code>-a</code> = all)"],
   ["cat /etc/os-release","<code>cat</code> shows the contents of a text file. This file names the distribution and version."]],
   out:"$ hostname\nsunrise-app\n$ uname -r\n5.15.0-91-generic\n$ cat /etc/os-release\nPRETTY_NAME=\"Ubuntu 22.04.5 LTS\"\nNAME=\"Ubuntu\"\nVERSION_ID=\"22.04\"\n..."}),
 tryit("t1","Identify the server. Read each task, try it, and open the Hint only if you are stuck."),
 idea("One tree, starting at /","Linux has a single directory tree. Its top is called <b>root</b> and written <code>/</code>. There are no drive letters: an extra disk is attached (mounted) at a directory such as <code>/data</code>.",V.tree('/\n├── bin      <em>essential commands</em>\n├── etc      <em>configuration</em>\n├── home\n│   └── student   <em>your files</em>\n├── root     <em>root user\'s home</em>\n├── tmp      <em>temporary files</em>\n├── usr\n│   └── bin  <em>most programs</em>\n└── var\n    └── log  <em>log files</em>'),"two"),
 wid("Explore the directories","Click a directory to see what it holds. Ask the class to guess first.",'<div class="dmap" id="dmap"></div>'),
 cmd("Look around: ls and cat",{p:"<code>ls</code> <b>l</b>i<b>s</b>ts what is inside a directory. <code>cat</code> shows what is inside a file. Give each one a path.",syn:[["ls","c"],["/etc","a"]],rows:[
   ["ls /","What is at the top of the tree?"],
   ["ls /etc","What is in the configuration directory?"],
   ["ls /home","Which users have a home folder?"],
   ["cat /etc/hostname","Show the file that stores this machine's name"]],
   out:"$ ls /\nbin  boot  dev  etc  home  lib  media  mnt  opt  proc  root  run  sbin  srv  sys  tmp  usr  var\n$ ls /home\nstudent\n$ cat /etc/hostname\nsunrise-app"}),
 idea("Everything is a file","Linux treats almost everything as a file. That is why the two commands you just learned, <code>ls</code> and <code>cat</code>, work almost everywhere.",V.grid([
   ["Settings","Plain text files in <code>/etc</code>"],
   ["Devices","The first disk is <code>/dev/sda</code>"],
   ["Running programs","Live information in <code>/proc</code>"],
   ["Logs","Text files in <code>/var/log</code>"]])),
 pred("Where would you look?","1. The web application's configuration\n2. Yesterday's error messages\n3. Sweety's documents\n4. A file that may vanish after a reboot","Give a directory for each.","1. <code>/etc</code> (here: <code>/etc/webapp/webapp.conf</code>)<br>2. <code>/var/log</code><br>3. <code>/home/sweety</code><br>4. <code>/tmp</code>"),
 tryit("t3","Sweety reports that the shop application will not start: the error says the document root was not found. Use the map and your two new commands to find the application's configuration and its log."),
 check(4),
 recap(["Linux is the kernel; a distribution adds the tools, shell and package manager.","Debian family uses <code>apt</code>; Red Hat family uses <code>dnf</code>.","One tree from <code>/</code>: config in <code>/etc</code>, logs in <code>/var/log</code>, users in <code>/home</code>, root's home in <code>/root</code>.","<code>ls</code> lists a directory; <code>cat</code> shows a file."],["hostname","uname -r","uname -a","cat /etc/os-release","ls /","ls /etc","cat FILE"])
]});

L({day:1,id:"architecture",n:2,stage:0,t:"How Linux Works",g:'<span>$</span> echo $SHELL',d:"Hardware, kernel, shell and applications, and what happens when you press Enter.",
learn:["The four layers of a Linux system","Terminal, shell and kernel: who does what","The journey of a single command"],
steps:[
 story("SZ","I have used Windows servers for years. When I type a command here and press Enter, who actually does the work?","Follow one command from your keyboard to the disk and back."),
 idea("Four layers","Each layer only talks to the one directly below it. You talk to the shell; the shell asks the kernel; the kernel drives the hardware.",V.fig("architecture0"),"two"),
 vs("Terminal, shell, kernel",[
   {t:"Terminal",pts:["The window you type in","Shows text, sends your keys","Example: GNOME Terminal, PuTTY"]},
   {t:"Shell",pts:["A program that reads your command","Finds the program and starts it","Example: <code>bash</code>, <code>zsh</code>, <code>sh</code>"]},
   {t:"Kernel",pts:["The core of the system","Creates processes, reads disks","You never talk to it directly"]}],
   "People often mix these three up. In an interview, keep them separate."),
 idea("The journey of one command","What happens between pressing Enter and seeing the result:",V.flow([
   ["1. You type","<code>ls /var/log</code> and press Enter"],
   ["2. Shell","splits the words, finds <code>/usr/bin/ls</code>"],
   ["3. Kernel","starts a process, reads the directory from disk"],
   ["4. Hardware","the disk returns the data"],
   ["5. Output","the result appears in your terminal"]])),
 cmd("Ask the system about itself",{rows:[
   ["whoami","Which user am I?"],
   ["echo $SHELL","Your login shell (the one set for you in /etc/passwd)"],
   ["echo $0","The shell running in this terminal right now"],
   ["cat /etc/shells","Which shells are installed?"],
   ["uname -a","Kernel name, release, machine type"]],
   out:"$ whoami\nstudent\n$ echo $SHELL\n/bin/bash\n$ echo $0\nbash\n$ cat /etc/shells\n# /etc/shells: valid login shells\n/bin/sh\n/bin/bash\n/usr/bin/bash\n..."}),
 pred("Predict","$ echo $SHELL","What will this print, and what does the <code>$</code> in front of SHELL do?","It prints the path of your login shell, such as <code>/bin/bash</code>.<br><br>The <code>$</code> tells the shell to replace the name with the value of the variable <code>SHELL</code>. Without it, <code>echo SHELL</code> just prints the word SHELL.<br><br>Note: <code>$SHELL</code> is your <b>login</b> shell. If you start another shell (for example by typing <code>sh</code>), <code>$SHELL</code> does not change; <code>echo $0</code> shows the shell you are really in."),
 tryit("t2","Ask the server who you are and which shell you are using."),
 check(3),
 recap(["Layers: hardware, kernel, shell, applications.","The terminal shows text; the shell interprets; the kernel does the work.","<code>$NAME</code> means the value of a variable; <code>$SHELL</code> is the login shell."],["whoami","echo $SHELL","echo $0","cat /etc/shells","uname -a"])
]});

function applyMode(old,mode,isDir){

CMDS.unzip=function(T,a){

/* ---------- task panel: goal first, then hint, then answer ---------- */
function mountLab(termId,goalsId,goals,allow,extra){
  extra=extra||{};
  var g=$("#"+goalsId),host=$("#"+termId);
  if(!g||!host) return;
  var h='<h4>Tasks</h4><ol>';
  goals.forEach(function(x,i){
    if(x.group&&(i===0||goals[i-1].group!==x.group)) h+='<li class="grp"><span>'+x.group+'</span></li>';
    h+='<li class="tk" data-i="'+i+'"><i></i><div><span class="tx">'+x.text+'</span>'+
      '<div class="tb"><button type="button" class="hb">Hint</button><button type="button" class="ab" hidden>Show answer</button></div>'+
      '<div class="hn" hidden>'+x.hint+'</div><div class="an" hidden>'+x.ans+'</div></div></li>';
  });
  h+='</ol><div class="prog"></div><p class="tip">Stuck? Open the hint first. The answer button appears after the hint.</p>';
  g.innerHTML=h;
  var items=$$("li.tk",g);
  items.forEach(function(li){
    var hb=$(".hb",li),ab=$(".ab",li);
    hb.addEventListener("click",function(){var d=$(".hn",li);d.hidden=!d.hidden;hb.textContent=d.hidden?"Hint":"Hide hint";ab.hidden=false;});
    ab.addEventListener("click",function(){var d=$(".an",li);d.hidden=!d.hidden;ab.textContent=d.hidden?"Show answer":"Hide answer";li.classList.add("peek");});
  });
  Term(host,{goals:goals,allow:allow,cmds:allow.join(" "),setup:extra.setup,onGoals:function(r){
    var n=r.filter(Boolean).length;
    items.forEach(function(li,i){li.classList.toggle("ok",r[i]);});
    $(".prog",g).textContent=n+" of "+r.length+" tasks complete";
  }});
}

der of layers from the user down to the machine is:", "code": null, "opts": ["Hardware, kernel, shell, applications", "Applications, shell, kernel, hardware", "Shell, applications, hardware, kernel", "Kernel, shell, hardware, applications"], "ans": 1, "exp": "User applications sit on top, then the shell, then the kernel, then hardware.", "orig": 2}, {"ch": 2, "stem": "A student runs the command below and sees <code>/bin/bash</code>. What does this tell you?", "code": "echo $SHELL", "opts": ["The kernel version is bash", "The user's login shell is bash", "The hostname is bash", "The command failed"], "ans": 1, "exp": "<code>$SHELL</code> holds the path of the user's login shell.", "orig": 2}, {"ch": 2, "stem": "Which of these is a Linux shell?", "code": null, "opts": ["bash", "ext4", "grub", "systemd"], "ans": 0, "exp": "<code>bash</code> is the most common shell. ext4 is a file system, grub a boot loader and systemd an init system.", "orig": 2}, {"ch": 2, "stem": "Which command prints the running kernel release?", "code": null, "opts": ["<code>uname -r</code>", "<code>whoami</code>", "<code>hostname</code>", "<code>pwd</code>"], "ans": 0, "exp": "<code>uname -r</code> shows the kernel release.", "orig": 2}, {"ch": 2, "stem": "Two users type commands at the same time on one Linux server. Which kernel responsibility makes this possible?", "code": null, "opts": ["Compiling programs", "Process and memory management", "Drawing the desktop", "Installing packages"], "ans": 1, "exp": "The kernel schedules processes and manages memory so many users and programs can run together.", "orig": 2}, {"ch": 1, "stem": "An application will not start. Where is the first place you should look for its configuration file?", "code": null, "opts": ["<code>/var/log</code>", "<code>/etc</code>", "<code>/tmp</code>", "<code>/dev</code>"], "ans": 1, "exp": "System-wide configuration lives in <code>/etc</code>.", "orig": 3}, {"ch": 1, "stem": "You need to read the error log of the web applicati   var shorts=QS.filter(function(x){return x.ch===ch&&!x.long;}),groups={},order=[];
  shorts.forEach(function(x){if(!groups[x.orig]){groups[x.orig]=[];order.push(x.orig);}groups[x.orig].push(x);});
  var pool=[],r=0;while(pool.length<k&&pool.length<shorts.length){order.forEach(function(o){if(pool.length<k&&groups[o][r]) pool.push(groups[o][r]);});r++;}
  if(pool.length<k) pool=pool.concat(QS.filter(function(x){return x.ch===ch&&x.long;}).slice(0,k-pool.length));
  var right=0,done=0;
  box.innerHTML=pool.map(function(x,qi){
    var ord=x.opts.map(function(_,i){return i;}).sort(function(){return Math.random()-.5;});
    return '<div class="cq" data-a="'+ord.indexOf(x.ans)+'"><div class="st">'+(qi+1)+'. '+x.stem+'</div>'+(x.code?'<pre>'+esc(x.code)+'</pre>':'')+
      '<div class="os">'+ord.map(function(oi,j){return '<button type="button" data-j="'+j+'"><b>'+String.fromCharCode(65+j)+'.</b> '+x.opts[oi]+'</button>';}).join("")+'</div><div class="ex">'+x.exp+'</div></div>';
  }).join("")+'<div class="score"></div>';
  $$(".cq",box).forEach(function(q){
    var a=+q.getAttribute("data-a");
    $$(".os button",q).forEach(function(b){b.addEventListener("click",function(){
      var j=+b.getAttribute("data-j");
      b.classList.add(j===a?"r":"w"); $$(".os button",q)[a].classList.add("r");
      q.classList.add("done"); done++; if(j===a) right++;
      if(done===pool.length) $(".score",box).textContent=right+" of "+pool.length+" correct."+(right<pool.length?" Read the explanations, then try the practice terminal again if needed.":" Ready for the next module.");
    });});
  });
});
/* ================= practice complete banners ================= */
$$(".done-banner").forEach(function(bn){
  var g=$("#g_"+bn.getAttribute("data-for")); if(!g) return;
  var pr=$(".prog",g); if(!pr) return;
  new MutationObserver(function(){var m=pr.textContent.match(/^(\d+) of (\d+)/);bn.classList.toggle("on",!!m&&m[1]===m[2]);}).observe(pr,{childList:true,characterData:true,subtree:true});
});
/* ================= router and lesson player ================= */
var CUR=null;
function lessonById(id){return LESSONS.filter(function(L){return L.id===id;})[0];}
function go(L,i){
  var root=$("#L-"+L.id),n=L.steps.length;
  i=Math.max(0,Math.min(n-1,i));CUR={L:L,i:i};
  $$(".step",root).forEach(function(s){s.classList.toggle("on",+s.getAttribute("data-i")===i);});
  var seen=SEEN[L.id]=SEEN[L.id]||[];
  if(seen.indexOf(i)<0){seen.push(i);store.set("lf3-seen",SEEN);}
  store.set("lf3-last-"+DAY,{id:L.id,i:i});
  $$(".rail button",root).forEach(function(b){var j=+b.getAttribute("data-i");b.classList.toggle("on",j===i);b.classList.toggle("seen",seen.indexOf(j)>-1);
    $("i",b).style.background=j===i?sc(L):(seen.indexOf(j)>-1?"":"");});
  $(".mid",root).textContent="Step "+(i+1)+" of "+n+"  ·  "+KIND[L.steps[i].k][0];
  $(".pv",root).disabled=i===0;
  var nxL=LESSONS[LESSONS.indexOf(L)+1];
  $(".nx",root).innerHTML=i<n-1?"Next &rarr;":(nxL?"Next module &rarr;":LABS[DAY][2]+" &rarr;");
  try{history.replaceState(null,"","#/m/"+L.id+"/"+i);}catch(e){}
  window.scrollTo(0,0);
}
LESSONS.forEach(function(L){
  var root=$("#L-"+L.id);
  $$(".rail button",root).forEach(function(b){b.addEventListener("click",function(){go(L,+b.getAttribute("data-i"));});});
  $(".pv",root).addEventListener("click",function(){go(L,CUR.i-1);});
  $(".nx",root).addEventListener("click",function(){
    if(CUR.i<L.steps.length-1) go(L,CUR.i+1);
    else{var nx=LESSONS[LESSONS.indexOf(L)+1];location.hash=nx?"#/m/"+nx.id:"#/labs";}
  });
});
function paintHome(){
  $$("#home .mod").forEach(function(a){
    var L=lessonById(a.getAttribute("data-id")),s=seenN(L),n=L.steps.length,pct=Math.round(s/n*100);
    $(".pg b",a).style.width=pct+"%";
    $(".pg span",a).textContent=s===0?n+" steps":(s>=n?"Completed":s+" of "+n+" steps");
    a.classList.toggle("done",s>=n);
  });
  var last=store.get("lf3-last-"+DAY,null),b=$("#startBtn");
  if(last&&lessonById(last.id)){var L=lessonById(last.id);b.textContent="Continue: Module "+L.n+", "+L.t;b.setAttribute("href","#/m/"+L.id+"/"+last.i);}
}
function route(){
  var p=location.hash.replace(/^#\/?/,"").split("/");
  $$("#view > .page, #view > .lesson").forEach(function(x){x.hidden=true;});
  CUR=null;var key="home";
  if(p[0]==="m"&&lessonById(p[1])){
    var L=lessonById(p[1]);$("#L-"+L.id).hidden=false;go(L,p[2]?+p[2]:0);key="home";
  }else if(p[0]==="labs"||p[0]==="quiz"||p[0]==="cheats"){$("#"+p[0]).hidden=false;key=p[0];window.scrollTo(0,0);}
  else{$("#home").hidden=false;paintHome();window.scrollTo(0,0);}
  $$(".top nav a").forEach(function(a){a.classList.toggle("on",a.getAttribute("data-k")===key&&!(key==="home"&&CUR));});
}
window.addEventListener("hashchange",route);
document.addEventListener("keydown",function(e){
  if(!CUR) return;
  var t=e.target,tg=t&&t.tagName;
  if(tg==="INPUT"||tg==="TEXTAREA"||tg==="SELECT"||(t&&t.isContentEditable)) return;
  if(e.key==="ArrowRight"||e.key==="PageDown"){e.preventDefault();$("#L-"+CUR.L.id+" .nx").click();}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();if(CUR.i>0) go(CUR.L,CUR.i-1);}
});
/* zoom for projectors */
var ZL=[0.9,1,1.15,1.3,1.5],zi=store.get("lf3-zoom",1);
function zoom(){view.style.zoom=ZL[zi];store.set("lf3-zoom",zi);}
$("#zIn").addEventListener("click",function(){if(zi<ZL.length-1){zi++;zoom();}});
$("#zOut").addEventListener("click",function(){if(zi>0){zi--;zoom();}});
zoom();
route();

/* ---------- quiz engine ---------- */
(function(){
  var app=$("#quizApp"),CHN=window.__CHN__;
  var S=null,timer=null;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function fmt(sec){var m=Math.floor(sec/60),s=sec%60;return m+":"+(s<10?"0":"")+s;}
  function setup(){
    clearInterval(timer);
    var today=QS.filter(function(x){return (window.__TODAY__||[]).indexOf(x.ch)>-1;}).length;
    var opts='<option value="-1">Today\'s modules ('+today+' questions)</option><option value="0">Everything so far ('+QS.length+')</option>'+Object.keys(CHN).sort(function(a,b){return a-b;}).map(function(k){
      var n=QS.filter(function(x){return x.ch==k;}).length;return '<option value="'+k+'">'+CHN[k]+' ('+n+')</option>';}).join("");
    app.innerHTML='<div class="qz-setup"><p style="margin:0">Choose a mode. <b>Practice</b> shows the answer and an explanation after every question. <b>Test</b> hides the answers until you submit, runs a timer and gives a chapter-wise result.</p>'+
     '<div class="row"><label>Mode <select id="qzMode"><option value="practice">Practice</option><option value="test">Test (timed)</option></select></label>'+
     '<label>Topic <select id="qzCh">'+opts+'</select></label>'+
     '<label>Questions <select id="qzN"><option value="10">10</option><option value="20" selected>20</option><option value="40">40</option><option value="999">All available</option></select></label></div>'+
     '<div class="row"><label>Style <select id="qzSt"><option value="all">All questions</option><option value="long">Scenario questions only</option><option value="short">Short questions only</option></select></label></div>'+
     '<div class="row"><label><input type="checkbox" id="qzNeg"> Negative marking (minus 0.25 per wrong answer)</label></div>'+
     '<button class="btn" id="qzGo" type="button">Start</button></div>';
    $("#qzGo").addEventListener("click",function(){
      var ch=+$("#qzCh").value,n=+$("#qzN").value,st=$("#qzSt").value,pool=QS.filter(function(x){return (ch===0||(ch===-1?(window.__TODAY__||[]).indexOf(x.ch)>-1:x.ch===ch))&&(st==="all"||(st==="long")===!!x.long);});
      if(!pool.length){window.alert("No questions match this selection.");return;}
      var qs=shuffle(pool).slice(0,n).map(function(x){
        var idx=shuffle(x.opts.map(function(_,i){return i;}));
        return {q:x,order:idx,pick:null,done:false};
      });
      S={mode:$("#qzMode").value,neg:$("#qzNeg").checked,qs:qs,i:0,t0:Date.now(),limit:qs.reduce(function(a,it){return a+(it.q.long?90:45);},0)};
      if(S.mode==="test"){timer=setInterval(tickT,1000);}
      paint();
    });
  }
  function tickT(){
    if(!S||S.mode!=="test"||S.fin){clearInterval(timer);return;}
    var left=S.limit-Math.floor((Date.now()-S.t0)/1000),el=$("#qzTime");
    if(left<=0){finish();return;}
    if(el) el.textContent=fmt(left);
  }
  function paint(){
    var it=S.qs[S.i],x=it.q,test=S.mode==="test";
    var answered=S.qs.filter(function(a){return a.pick!==null;}).length;
    var h='<div class="qz-bar"><span>Question <b>'+(S.i+1)+'</b> of '+S.qs.length+'</span><span>Answered <b>'+answered+'</b></span>'+(test?'<span>Time left <b id="qzTime">'+fmt(Math.max(0,S.limit-Math.floor((Date.now()-S.t0)/1000)))+'</b></span>':'')+'</div>';
    h+='<div class="qz-q"><div class="tag">'+CHN[x.ch]+'</div><div class="stem">'+x.stem+'</div>'+(x.code?'<pre>'+esc(x.code)+'</pre>':'');
    it.order.forEach(function(oi,k){
      var cls="qz-opt";
      if(it.pick===k) cls+=" sel";
      if(!test&&it.done){ if(oi===x.ans) cls+=" right"; else if(it.pick===k) cls+=" wrong"; }
      h+='<button type="button" class="'+cls+'" data-k="'+k+'"><b>'+String.fromCharCode(65+k)+'.</b> '+x.opts[oi]+'</button>';
    });
    if(!test&&it.done) h+='<div class="qz-exp"><b>'+(it.order[it.pick]===x.ans?"Correct. ":"Not quite. ")+'</b>'+x.exp+'</div>';
    h+='</div><div class="qz-nav">';
    h+='<button class="btn ghost" id="qzPrev" type="button"'+(S.i===0?' disabled':'')+'>Previous</button>';
    if(S.i<S.qs.length-1) h+='<button class="btn" id="qzNext" type="button">Next</button>';
    h+='<button class="btn'+(S.i<S.qs.length-1?' ghost':'')+'" id="qzFin" type="button">'+(test?'Submit test':'Finish and see results')+'</button></div>';
    app.innerHTML=h;
    $$(".qz-opt",app).forEach(function(b){b.addEventListener("click",function(){
      if(!test&&it.done) return;
      it.pick=+b.getAttribute("data-k"); if(!test) it.done=true;
      paint();
    });});
    $("#qzPrev").addEventListener("click",function(){S.i--;paint();});
    var nx=$("#qzNext"); if(nx) nx.addEventListener("click",function(){S.i++;paint();});
    $("#qzFin").addEventListener("click",function(){
      var un=S.qs.filter(function(a){return a.pick===null;}).length;
      if(un&&S.mode==="test"&&!window.confirm("You have "+un+" unanswered question(s). Submit anyway?")) return;
      finish();
    });
  }
  function finish(){
    clearInterval(timer);S.fin=true;
    var ok=0,wr=0,sk=0,per={};
    S.qs.forEach(function(it){
      var c=it.q.ch;per[c]=per[c]||{n:0,ok:0};per[c].n++;
      if(it.pick===null) sk++; else if(it.order[it.pick]===it.q.ans){ok++;per[c].ok++;} else wr++;
    });
    var score=ok-(S.neg?wr*0.25:0),max=S.qs.length,pct=Math.round(Math.max(0,score)/max*100);
    var secs=Math.round((Date.now()-S.t0)/1000);
    var verdict=pct>=75?"Strong. You are ready for a screening round on these topics.":pct>=50?"Fair. Revisit the chapters marked below and try again.":"Needs work. Re-read the chapters, repeat the practice terminals, then retake.";
    var h='<div class="qz-res"><div class="big">'+score.toFixed(S.neg?2:0)+' / '+max+' <small style="font-size:16px;font-weight:400;color:var(--muted)">('+pct+'%)</small></div>'+
      '<p style="margin:4px 0 0">Correct '+ok+', wrong '+wr+', unanswered '+sk+'. Time taken '+fmt(secs)+'. '+verdict+'</p>'+
      '<div class="tablewrap"><table><tr><th>Topic</th><th>Correct</th><th>Result</th></tr>'+
      Object.keys(per).sort().map(function(c){var p=per[c],r=Math.round(p.ok/p.n*100);return '<tr><td>'+CHN[c]+'</td><td>'+p.ok+' / '+p.n+'</td><td>'+r+'%'+(r<60?' (revise)':'')+'</td></tr>';}).join("")+
      '</table></div>'+
      '<div class="qz-nav"><button class="btn" id="qzAgain" type="button">New quiz</button><button class="btn ghost" id="qzRetry" type="button">Retry wrong answers only</button></div></div>';
    var wrong=S.qs.filter(function(it){return it.pick===null||it.order[it.pick]!==it.q.ans;});
    h+='<div class="qz-rev"><h3 id="quiz-review" style="margin-top:18px">Review of missed questions</h3>'+(wrong.length?wrong.map(function(it,i){
      var x=it.q;
      return '<details><summary>'+(i+1)+'. '+x.stem+'</summary>'+(x.code?'<pre>'+esc(x.code)+'</pre>':'')+
       '<p style="margin:8px 0 4px">Your answer: '+(it.pick===null?'not answered':x.opts[it.order[it.pick]])+'</p><p style="margin:0 0 4px"><b>Correct answer:</b> '+x.opts[x.ans]+'</p><p style="margin:0">'+x.exp+'</p></details>';
    }).join(""):"<p>No missed questions.</p>")+'</div>';
    app.innerHTML=h;
    $("#qzAgain").addEventListener("click",setup);
    $("#qzRetry").addEventListener("click",function(){
      if(!wrong.length){setup();return;}
      S={mode:"practice",neg:false,qs:wrong.map(function(it){return {q:it.q,order:shuffle(it.q.opts.map(function(_,i){return i;})),pick:null,done:false};}),i:0,t0:Date.now(),limit:0};
      paint();
    });
    app.scrollIntoView({behavior:"smooth",block:"start"});
  }
  setup();
})();

})();
</script>
